services:

  postgres:
    image: postgres:17
    container_name: poo2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: midb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - red-servidores

  pgadmin:
    image: dpage/pgadmin4
    container_name: poo2-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - red-servidores

  apache:
    build: ./apache
    container_name: poo2-apache
    restart: always
    volumes:
      - ./:/var/www/html
    ports:
      - "8091:80"
    depends_on:
      - postgres
    networks:
      - red-servidores

networks:
  red-servidores:

volumes:
  pgdata: